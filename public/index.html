<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Group 6 Rock Shop</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>RockBay</h1>
    <p>Buy unique rocks with custom designs and textures.</p>
  </header>

  <main>
    <section class="card">
      <h2>Login</h2>
      <form>
        <label>
          Email
          <input type="email" placeholder="you@example.com" required />
        </label>

        <label>
          Password
          <input type="password" placeholder="********" required />
        </label>

        <button type="submit">Login</button>
      </form>
    </section>

    <section class="card">
      <h2>New here?</h2>
      <p>Create an account to browse, customize, and purchase our rocks.</p>
      <button type="button">Register</button>
    </section>
  </main>

  <footer>
    <p>&copy; Rock Shop</p>
  </footer>
</body>
</html>
