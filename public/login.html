<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login – RockBay</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="top-row">
      <div class="logo">RockBay</div>
      <div class="search-bar">
        <input type="text" placeholder="Search crystal, minerals..." />
      </div>
      <a href="profile.html" class="wish-link">Wish</a>
    </div>

    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="profile.html">Profile</a>
      <a href="login.html">Login</a>
    </nav>
  </header>

  <main class="page-main">
    <section class="auth-layout">
      <section class="card auth-card">
        <h2>Login</h2>
        <form>
          <label>
            Email
            <input type="email" placeholder="you@example.com" required />
          </label>

          <label>
            Password
            <input type="password" placeholder="********" required />
          </label>

          <button type="submit">Login</button>
        </form>
      </section>

      <section class="card auth-card">
        <h2>New here?</h2>
        <p>Create an account to browse, customize, and purchase our rocks.</p>
        <button type="button">Register</button>
      </section>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-links">
      <a href="#">About Rocks</a>
      <a href="#">Shipping</a>
      <a href="#">Crystal Guide</a>
      <a href="#">FAQ</a>
      <a href="#">Contact</a>
      <a href="#">Social media</a>
    </div>
    <p class="footer-copy">&copy; 2025 RockBay</p>
  </footer>
</body>
</html>
